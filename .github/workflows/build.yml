name: Rust Cross-Platform Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libasound2-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy lints
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir staging
          copy target\release\photosort.exe staging\
          powershell Compress-Archive -Path staging\* -DestinationPath photosort-windows.zip

      - name: Package artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir staging
          cp target/release/photosort staging/
          zip -j photosort-macos.zip staging/photosort

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir staging
          cp target/release/photosort staging/
          tar -czf photosort-linux.tar.gz -C staging photosort

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photosort-${{ matrix.os }}
          path: |
            photosort-*.zip
            photosort-*.tar.gz
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: photosort-windows-latest
          path: ./artifacts/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: photosort-macos-latest
          path: ./artifacts/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: photosort-ubuntu-latest
          path: ./artifacts/linux

      - name: Prepare assets for release
        run: |
          mkdir -p release-assets
          cp ./artifacts/windows/photosort-windows.zip ./release-assets/
          cp ./artifacts/macos/photosort-macos.zip ./release-assets/
          cp ./artifacts/linux/photosort-linux.tar.gz ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/photosort-windows.zip
            release-assets/photosort-macos.zip
            release-assets/photosort-linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
